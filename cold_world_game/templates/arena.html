<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="武器试验场">
  <title>寒境 · 武器试验场</title>
  <link rel="icon" href="/static/assets/handgun.png">
  <link rel="stylesheet" href="/static/css/arena.css">
  <script type="module" src="/static/js/arena.js"></script>
</head>
<body data-page-title="arena.title" data-page-description="arena.setup">
  <main>
    <header class="page-header">
      <h1 data-i18n="arena.heading"></h1>
      <nav><a href="/replay/" data-i18n="replay.heading"></a><button type="button" data-language-toggle>EN</button></nav>
    </header>
    <div class="workspace">
      <section class="panel setup">
        <h2 data-i18n="arena.setup"></h2>
        <form id="configuration">
          <fieldset id="settings" disabled>
            <label><span data-i18n="arena.weapon"></span><select id="weapon"></select></label>
            <label><span data-i18n="arena.intensity"></span><select id="intensity"></select></label>
            <label><span data-i18n="arena.terrain"></span><select id="terrain"></select></label>
            <label><span data-i18n="arena.strategy"></span><select id="strategy"></select></label>
            <div class="form-row">
              <label><span data-i18n="arena.seed"></span><input name="seed" type="number" min="0" max="4294967295" value="45" required></label>
              <label><span data-i18n="arena.duration"></span><input name="duration" type="number" min="1" max="3600" value="45" required></label>
            </div>
            <label id="password-field" hidden><span data-i18n="replay.password"></span><input id="password" type="password" autocomplete="current-password"></label>
            <button class="primary" type="submit" data-i18n="arena.start"></button>
          </fieldset>
        </form>
        <p id="error" class="error" role="alert" hidden></p>
      </section>
      <section class="panel battle">
        <div class="battle-header">
          <h2 id="status" role="status" data-i18n="arena.loading"></h2>
          <div class="button-row">
            <button id="pause" type="button" disabled data-i18n="replay.pause"></button>
            <button id="stop" type="button" disabled data-i18n="arena.stopSave"></button>
            <button id="repeat" type="button" hidden data-i18n="arena.repeat"></button>
            <a id="watch" hidden data-i18n="replay.watch"></a>
          </div>
        </div>
        <canvas id="world" data-i18n-aria-label="arena.heading"></canvas>
        <div class="metrics">
          <div><span data-i18n="replay.time"></span><strong id="elapsed">—</strong></div>
          <div><span data-i18n="arena.kills"></span><strong id="kills">—</strong></div>
          <div><span data-i18n="arena.alive"></span><strong id="alive">—</strong></div>
          <div><span data-i18n="arena.remaining"></span><strong id="remaining">—</strong></div>
        </div>
        <p id="decision" class="battle-note hint"></p>
        <section id="editor" class="editor" hidden>
          <details open>
            <summary data-i18n="arena.gear"></summary>
            <form id="loadout">
              <div class="form-row">
                <label><span data-i18n="arena.storage"></span><select name="storage"><option value="inventory" data-i18n="arena.storage.inventory"></option><option value="backpack" data-i18n="arena.storage.backpack"></option></select></label>
                <label><span data-i18n="arena.slot"></span><select name="slot"></select></label>
              </div>
              <label><span data-i18n="arena.item"></span><select name="kind"></select></label>
              <div class="form-row">
                <label><span data-i18n="arena.quantity"></span><input name="count" type="number" min="1" value="1" required></label>
                <label><span data-i18n="arena.remaining"></span><input name="remaining" type="number" min="0" data-i18n-placeholder="arena.full"></label>
              </div>
              <button type="submit" data-i18n="arena.edit.equip"></button>
            </form>
          </details>
          <details>
            <summary data-i18n="arena.edit.player"></summary>
            <form id="player-edit">
              <output id="player-current" class="hint"></output>
              <div class="form-row">
                <label><span data-i18n="arena.temperature"></span><input name="temperature" type="number" min="0" max="36" step=".1"></label>
                <label><span data-i18n="arena.hunger"></span><input name="hunger" type="number" min="0" max="10" step=".1"></label>
                <label><span data-i18n="arena.money"></span><input name="money" type="number" min="0"></label>
              </div>
              <div class="form-row">
                <label>X<input name="x" type="number" min="-500" max="500" step=".1"></label>
                <label>Y<input name="y" type="number" min="-500" max="500" step=".1"></label>
              </div>
              <button type="submit" data-i18n="arena.apply"></button>
            </form>
            <label><span data-i18n="arena.strategy"></span><select id="live-strategy"></select></label>
          </details>
          <details id="terrain-editor">
            <summary data-i18n="arena.edit.tile"></summary>
            <form id="tile-edit">
              <p class="hint" data-i18n="arena.tileHint"></p>
              <label><span data-i18n="arena.terrain"></span><select name="kind"></select></label>
              <label id="tile-ammo" hidden><span data-i18n="arena.ammo"></span><input name="ammo" type="number" min="0" max="1000" data-i18n-placeholder="arena.full"></label>
              <div class="form-row">
                <label>X<input name="x" type="number" min="-500" max="500" value="3" required></label>
                <label>Y<input name="y" type="number" min="-500" max="500" value="0" required></label>
              </div>
              <button type="submit" data-i18n="arena.apply"></button>
            </form>
          </details>
          <details>
            <summary data-i18n="arena.monsters"></summary>
            <form id="monsters">
              <label><span data-i18n="arena.monsterType"></span><select name="kind"></select></label>
              <div class="form-row">
                <label><span data-i18n="arena.quantity"></span><input name="count" type="number" min="0" max="64" value="1" required></label>
                <label><span data-i18n="arena.cap"></span><input name="cap" type="number" min="1" max="64" value="12" required></label>
                <label><span data-i18n="arena.interval"></span><input name="interval" type="number" min=".5" max="300" step=".5" value="5" required></label>
              </div>
              <div class="form-row">
                <label>X<input name="x" type="number" min="-500" max="500" step=".1"></label>
                <label>Y<input name="y" type="number" min="-500" max="500" step=".1"></label>
              </div>
              <div class="button-row">
                <button type="submit" value="spawn" data-i18n="arena.edit.spawn"></button>
                <button type="submit" value="spawning" data-i18n="arena.edit.spawning"></button>
                <button type="button" id="clear" data-i18n="arena.edit.clear"></button>
              </div>
              <p class="hint" data-i18n="arena.spawnHint"></p>
            </form>
          </details>
        </section>
      </section>
    </div>
  </main>
</body>
</html>
