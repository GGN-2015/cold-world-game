[project]
name = "cold-world-game"
version = "0.1.0"
description = "Browser survival game with an authoritative Flask and WebSocket server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1,<4",
    "flask-sock>=0.7,<1",
    "simple-websocket>=1.1,<2",
    "filelock>=3.16,<4",
]

[project.scripts]
cold-world-game = "cold_world_game.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cold_world_game"
module-root = ""
source-include = ["docs/**", "tools/generate_assets.py", "tools/expansion_assets.py", "tools/machine_assets.py", "tools/manual_assets.py", "tools/generate_audio.py", "uv.lock"]
