<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寒境 · 战斗回放</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10171d;
      --panel: #17232c;
      --line: #344550;
      --muted: #a5bac7;
      --text: #e9f1f5;
      --accent: #8ce5cc;
      --danger: #ffa497;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--text); }
    main { max-width: 1290px; margin: auto; padding: 22px 24px 32px; }
    header, .toolbar, .legend, .metrics { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header { justify-content: space-between; margin-bottom: 16px; }
    h1 { margin: 0; font-size: 1.6rem; }
    h2 { font-size: 1rem; margin: 0; }
    button, select {
      border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px;
      font: inherit; color: var(--text); background: #1c2b36;
    }
    button { cursor: pointer; }
    button:hover, select:hover { border-color: var(--accent); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .toolbar { margin-bottom: 12px; }
    .files { margin-bottom: 12px; color: var(--muted); }
    .files input { max-width: 100%; }
    .toolbar label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(315px, .55fr); gap: 12px; }
    .panel { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); min-width: 0; }
    .map { overflow: hidden; }
    canvas { display: block; width: 100%; height: clamp(220px, 39vh, 395px); background: #111e27; }
    .legend { padding: 9px 12px; font-size: .82rem; color: var(--muted); }
    .legend b { color: var(--swatch); padding-right: 3px; }
    .transport { border-top: 1px solid var(--line); padding: 11px 12px; }
    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    #play { color: #11231e; background: var(--accent); font-weight: 700; min-width: 5em; }
    #time { margin-left: auto; font-variant-numeric: tabular-nums; }
    #timeline { width: 100%; margin: 12px 0 0; accent-color: var(--accent); }
    #hotbar { display: flex; gap: 6px; margin: 9px 0 0; }
    #hotbar span { display: grid; place-items: center; position: relative; width: 35px; height: 35px; border: 1px solid var(--line); border-radius: 5px; }
    #hotbar .held { border-color: #eeb979; background: #353629; }
    #hotbar img { width: 26px; height: 26px; object-fit: contain; image-rendering: pixelated; }
    #hotbar small { position: absolute; bottom: 0; right: 2px; background: #10171d; }
    .status { padding: 12px; border-top: 1px solid var(--line); }
    .metrics { font-size: .9rem; font-variant-numeric: tabular-nums; }
    .metrics span { color: var(--muted); }
    .metrics strong { color: var(--text); margin-inline-start: 5px; }
    #decision { margin: 10px 0 0; min-height: 1.5em; color: var(--accent); }
    #context { margin: 6px 0 0; color: var(--muted); font-size: .83rem; }
    .events { padding: 12px; }
    .events header { margin-bottom: 8px; gap: 6px; }
    #events { max-height: 290px; overflow: auto; display: grid; gap: 4px; }
    #events button { text-align: start; display: grid; grid-template-columns: 4.4em minmax(0, 1fr); gap: 4px; padding: 7px 8px; font-size: .84rem; }
    #events button[aria-current="true"] { border-color: var(--accent); background: #233f43; }
    #events time { color: var(--muted); font-variant-numeric: tabular-nums; }
    #details { min-height: 112px; margin: 8px 0 0; border-top: 1px solid var(--line); padding: 9px 0 0; font-size: .81rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .compare { margin-top: 12px; padding: 12px; }
    table { width: 100%; border-collapse: collapse; margin-top: 7px; text-align: start; font-size: .86rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: start; padding: 7px 5px; }
    th { color: var(--muted); font-weight: normal; }
    [data-selected="true"] { color: var(--accent); }
    .table-scroll { overflow-x: auto; }
    @media (max-width: 820px) {
      main { padding: 12px; }
      .layout { grid-template-columns: 1fr; }
      #events { max-height: 205px; }
    }
  </style>
  <meta name="description" content="Cold World combat replay">
  <script type="importmap"><!-- GAME_MODULES --></script>
</head>
<body>
  <main>
    <header><h1 data-t="title">寒境 · 战斗回放</h1><button id="language" type="button" lang="en">English</button></header>
    <div class="files">
      <label><span data-t="open_files">打开录像文件</span> <input id="files" type="file" multiple accept=".gz,.json,application/gzip,application/json"></label>
      <p id="file-status" role="status"></p>
    </div>
    <div class="toolbar">
      <label><span data-t="scenario">场景</span><select id="scenario"></select></label>
      <label><span data-t="policy">打法</span><select id="policy"></select></label>
      <label><span data-t="recording">录像</span><select id="recording"></select></label>
      <label><span data-t="camera">镜头</span><select id="camera"></select></label>
      <button id="difference" type="button" data-t="difference">跳到首次决策分岔</button>
    </div>
    <div class="layout">
      <section class="panel map">
        <canvas id="map" data-aria="map" aria-label="战斗俯视地图"></canvas>
        <div class="legend">
          <label><input type="checkbox" id="overlays" checked> <span data-t="overlays">显示路线与瞄点</span></label>
        </div>
        <div class="transport">
          <div class="controls">
            <button id="play" type="button">播放</button>
            <button id="previous" type="button" data-t="previous">上一帧</button>
            <button id="next" type="button" data-t="next">下一帧</button>
            <select id="speed" data-aria="speed" aria-label="播放速度">
              <option value=".5">0.5×</option><option value="1" selected>1×</option>
              <option value="2">2×</option><option value="4">4×</option>
            </select>
            <output id="time" for="timeline"></output>
          </div>
          <input id="timeline" type="range" min="0" value="0" step="1" data-aria="timeline" aria-label="回放时间轴">
        </div>
        <div class="status">
          <div class="metrics" id="metrics"></div>
          <div id="hotbar"></div>
          <p id="decision"></p>
          <p id="context"></p>
        </div>
      </section>
      <section class="panel events">
        <header><h2 data-t="events">事件与操作</h2>
          <label><span data-t="filter">筛选</span> <select id="filter"></select></label>
        </header>
        <div id="events"></div>
        <pre id="details"></pre>
      </section>
    </div>
    <section class="panel compare">
      <h2 data-t="compare">同场对照</h2>
      <div class="table-scroll"><table id="comparison"></table></div>
    </section>
    <section class="panel compare" id="batch" hidden>
      <h2 data-t="batch">各档存活率</h2>
      <div class="table-scroll"><table id="rates"></table></div>
    </section>
  </main>
  <script id="replay-data" type="application/octet-stream"><!-- REPLAY_DATA --></script>
  <script id="game-assets" type="application/json"><!-- GAME_ASSETS --></script>
  <script type="module">

        player_hurt: "玩家受击", death: "怪物倒下", decision: "决定", end: "结束",
        select: "切换物品栏", attack: "按下攻击", release: "松开攻击", accepted: "服务器接受指令",

      },
      en: {

        open_files: "Open replay files", select_files: "Select one or more .replay.gz files or older replay JSON files.", loaded: "Loaded {count} matches.", invalid_files: "Could not open",
        recording: "Recording", camera: "Camera", follow: "Follow AI", overview: "Overview", overlays: "Show route and aim",
        regroup: "No immediate threat. Reposition", melee_save: "Use melee to save ammunition", melee_close: "Use melee at close range",
        fire: "Fire on an exposed target", fire_threat: "Fire on a high-threat target", reposition: "Wait for a clear shot or reposition",
        dodge: "Incoming shot intersects route. Dodge", ranged_hurt: "Hit by a hostile bullet", ranged_hits: "Bullet hits taken", dodges: "Dodges",
        sidearm: "Sidearm", spread: "Spread", automatic: "Automatic", precision: "Precision", freeze: "Freeze", burn: "Burn",
        cautious_note: "Makes space around 7 tiles away, prioritizes fast and large monsters, and saves ammunition with melee. Both policies dodge.",
        bold_note: "Holds position until about 3.2 tiles, fires at longer range, and prioritizes the nearest monster. Both policies dodge.",
        crawler: "Crawler", armored: "Armored monster", stalker: "Stalker", big: "Large monster",
        open_field: "Open field", pine_woods: "Pine woods", ruins: "Ruins", survived: "Survived all waves",
        pressure: "Per wave", seed: "Seed", kills: "Kills", uses: "Charges spent", wave: "Wave started", wave_count: "Waves",
        batch: "Survival by density", pass_rate: "Survival rate", passed: "Matches survived", density: "Monsters per wave",
        player: "Bot and route", monster: "Monster", tree: "Tree", bullet: "Bullet", goal: "Exploration goal",
        play: "Play", pause: "Pause", previous: "Previous frame", next: "Next frame", speed: "Playback speed",
        timeline: "Replay timeline", map: "Overhead combat map", events: "Events and actions", filter: "Filter",
        all: "All", decisions: "Decisions", combat: "Combat outcomes", commands: "Player commands",
        compare: "Same-scene comparison", outcome: "Outcome", duration: "Time", rounds: "Rounds spent", swings: "Axe swings",
        hits: "Gun / axe hits", misses: "Misses", hurt: "Hits taken", temperature: "Temperature", hunger: "Hunger", ammo: "Ammo remaining",
        weapon: "Held weapon", awaiting: "Waiting for first decision", choose: "Select an event to inspect it.",
        empty: "No events match this filter.", open_route: "Slow monster · Open route",
        fast_monster: "Fast monster · Blocks the route", blocked_shot: "Tree blocks the shot · Reposition",
        cautious: "Cautious", bold: "Bold", handgun: "Handgun", axe: "Axe", small: "Slow monster", fast: "Fast monster",
        reached: "Reached goal", downed: "Downed", timeout: "Timed out",
        advance: "Continue toward the exploration goal", bypass: "Go around the slow monster", close: "Move closer and wait for range",
        obstacle: "Move around an obstacle", blocked: "Tree blocks the shot. Move sideways", reserve: "Use the axe to save ammo",
        use_axe: "The slow monster is in range. Use the axe", use_handgun: "The fast monster is closing. Use the handgun",
        spawn: "Monster appeared", shot: "Shot fired", melee: "Axe swung", hit: "Monster hit", miss: "Bullet expired without hitting a monster",
        player_hurt: "Player hit", death: "Monster killed", decision: "Decision", end: "End",
        select: "Select hotbar slot", attack: "Press attack", release: "Release attack", accepted: "Server accepted command",
        denied: "Server declined command", swing: "Swing triggered", no_swing: "Swing did not trigger",
        aim: "Aim point", waypoint: "Waypoint", move: "Movement direction", target: "Target", no_difference: "The decisions match in this scene.",
        info: "Fixed seed {seed} · {rate} Hz · Time since scenario start",
      },
    };
    const encoded = document.getElementById("replay-data").textContent;
    const bytes = Uint8Array.from(atob(encoded), character => character.charCodeAt(0));
    function decodeRecording(blob) {
      return new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).json();
    }
    let data = bytes.length ? await decodeRecording(new Blob([bytes])) : { trials: [] };
    const assets = JSON.parse(document.getElementById("game-assets").textContent);
    const images = new Map(await Promise.all(Object.entries(assets.images).map(async ([name, url]) => {
      const image = new Image();
      image.src = url;
      await image.decode();
      return [name, image];
    })));
    const byId = id => document.getElementById(id);
    const canvas = byId("map");
    const renderer = new WorldRenderer(canvas, images, assets.animations, assets.effects, assets.catalog, null, assets.monsterHitboxes, { replay: true });
    const context = renderer.context;
    const eventList = byId("events");
    const scenarioSelect = byId("scenario");
    const policySelect = byId("policy");
    const recordingSelect = byId("recording");
    const timeline = byId("timeline");
    let language = "zh";
    let trial, frameIndex = 0, selectedEvent = null;
    let fileErrors = [];
    let renderedTrial, renderedFrame = -1, gameEventIndex = 0;
    let playing = false, animation = 0, playbackStart = null, playbackFrame = 0;

    function t(key) { return copy[language][key] ?? key; }
    function clock(tick) { return (tick / data.tick_rate).toFixed(2) + " s"; }
    function pointText(point) { return point?.map(value => value.toFixed(2)).join(", ") ?? "—"; }
    function options(select, values) {
      const previous = select.value;
      select.replaceChildren(...values.map(value => new Option(t(value), value)));
      if (values.includes(previous)) select.value = previous;
    }
    function reason(key) {
      return t(key === "axe" || key === "handgun" ? "use_" + key : key);
    }

    function applyFrame(index, elapsed) {
      const frame = trial.frames[index];
      const view = frame.view;
      const tick = frame.tick;
      const previousTick = trial.frames[index - 1]?.tick ?? -1;
      const decision = frame.decision;
      const events = [];
      while (gameEventIndex < trial.gameEvents.length && trial.gameEvents[gameEventIndex].tick <= tick) {
        const event = trial.gameEvents[gameEventIndex++];
        if (event.tick > previousTick) events.push(event);
      }
      renderer.selected = view.you.selected;
      renderer.pointer = { x: decision?.aim[0] ?? view.you.x + 1, y: decision?.aim[1] ?? view.you.y, active: false };
      renderer.setState({ ...view, paused: false, movement: { mode: 'server' }, structures: trial.structures,
        chunks: trial.chunks, events, event_sequence: events.at(-1)?.id ?? 0 });
      renderer.draw(elapsed);
    }

    function draw() {
      if (!trial) return;
      const frame = trial.frames[frameIndex];
      const center = trial.center ?? [7, 0];
      renderer.replayCamera = byId("camera").value === "overview" ? { x: center[0], y: center[1] } : null;
      const scale = renderer.replayCamera ? Math.min(renderer.width / 31, renderer.height / 27) : renderer.width / 23;
      if (renderer.scale !== scale) {
        renderer.scale = scale;
        renderer.snow = null;
      }
      if (renderedTrial !== trial || frameIndex < renderedFrame || frameIndex - renderedFrame > 10) {
        renderer.reset();
        const start = Math.max(0, frameIndex - Math.ceil(1.1 * data.tick_rate / (trial.sample_ticks ?? 1)));
        renderer.elapsed = trial.frames[start].tick / data.tick_rate;
        renderedFrame = start - 1;
        gameEventIndex = 0;
        renderedTrial = trial;
      }
      if (renderedFrame === frameIndex) renderer.draw(0);
      while (renderedFrame < frameIndex) {
        renderedFrame++;
        applyFrame(renderedFrame, renderedFrame > 0 ? trial.frames[renderedFrame].view.elapsed - trial.frames[renderedFrame - 1].view.elapsed : 0);
      }
      if (!byId("overlays").checked) return;
      const line = (points, color, dash = []) => {
        if (points.length < 2) return;
        context.strokeStyle = color;
        context.lineWidth = 1.6;
        context.setLineDash(dash);
        context.beginPath();
        for (const [index, point] of points.entries()) {
          const pixel = renderer.screenPoint(...point);
          if (index === 0) context.moveTo(pixel.x, pixel.y);
          else context.lineTo(pixel.x, pixel.y);
        }
        context.stroke();
        context.setLineDash([]);
      };
      line(trial.frames.slice(Math.max(0, frameIndex - 100), frameIndex + 1).map(entry => entry.position), '#43ffe0');
      const decision = frame.decision;
      if (decision) line([frame.position, decision.aim], decision.reason === 'blocked' ? '#ffb2a0' : '#ffdc8e', [5, 4]);
      if (trial.goal) {
        const point = renderer.screenPoint(...trial.goal);
        context.strokeStyle = '#effaff';
        context.strokeRect(point.x - 5, point.y - 5, 10, 10);
      }
      if (selectedEvent && Number.isFinite(selectedEvent.x) && selectedEvent.tick <= frame.tick &&
          selectedEvent.tick > (trial.frames[frameIndex - 1]?.tick ?? -1)) {
        if (selectedEvent.bullet) line([selectedEvent.bullet, [selectedEvent.x, selectedEvent.y]], '#ffa497', [4, 3]);
        const point = renderer.screenPoint(selectedEvent.x, selectedEvent.y);
        context.strokeStyle = '#ffd483';
        context.beginPath();
        context.arc(point.x, point.y, 13, 0, Math.PI * 2);
        context.stroke();
      }
    }

    function showFrame(index) {
      frameIndex = Math.max(0, Math.min(index, trial.frames.length - 1));
      const frame = trial.frames[frameIndex];
      timeline.value = frameIndex;
      byId("time").textContent = clock(frame.tick) + " / " + clock(trial.frames.at(-1).tick);
      const metrics = [
        ["temperature", frame.temperature.toFixed(2) + " °C"], ["hunger", frame.hunger.toFixed(2)],
        ["ammo", frame.ammo], ["weapon", frame.weapon ? itemName(frame.weapon) : "—"],
      ];
      if (data.wave_seconds) {
        metrics.push(["wave_count", data.wave_seconds.filter(second => frame.tick >= second * data.tick_rate).length + " / " + data.wave_seconds.length]);
      }
      byId("metrics").replaceChildren(...metrics.map(([label, value]) => {
        const item = document.createElement("span");
        const number = document.createElement("strong");
        number.textContent = value;
        item.append(t(label), number);
        return item;
      }));
      byId("hotbar").replaceChildren(...frame.view.you.inventory.slice(0, 5).map((item, index) => {
        const slot = document.createElement("span");
        if (index === frame.view.you.selected) slot.className = "held";
        if (item && assets.images[item.kind]) {
          const icon = document.createElement("img");
          icon.src = assets.images[item.kind];
          icon.alt = itemName(item.kind);
          slot.title = icon.alt;
          slot.append(icon);
          if (item.ammo != null || item.uses != null) {
            const count = document.createElement("small");
            count.textContent = item.ammo ?? item.uses;
            slot.append(count);
          }
        }
        return slot;
      }));
      byId("decision").textContent = frame.decision ? reason(frame.decision.reason) : t("awaiting");
      draw();
    }

    function setPlaying(value) {
      playing = value;
      cancelAnimationFrame(animation);
      byId("play").textContent = t(value ? "pause" : "play");
      if (value) {
        playbackStart = null;
        playbackFrame = frameIndex;
        animation = requestAnimationFrame(animate);
      }
    }

    function animate(now) {
      if (!playing) return;
      playbackStart ??= now;
      const elapsed = (now - playbackStart) * Number(byId("speed").value) / 1000;
      const next = playbackFrame + Math.floor(elapsed * data.tick_rate / (trial.sample_ticks ?? 1));
      if (next !== frameIndex) showFrame(next);
      if (frameIndex === trial.frames.length - 1) setPlaying(false);
      else animation = requestAnimationFrame(animate);
    }

    function eventLabel(event) {
      switch (event.type) {
        case "decision": return reason(event.reason);
        case "command": {
          if (event.command.type === "select") return t("select") + " · " + (event.command.slot + 1);
          if (event.weapon) return t(event.command.pressed ? "attack" : "release") + " · " + itemName(event.weapon);
          return event.command.type;
        }
        case "spawn": return t("spawn") + " · " + t(event.kind);
        case "wave": return t("wave") + " · " + event.number + " · " + event.count;
        case "shot": return t("shot") + " · " + itemName(event.kind)
          + (event.ammo_before == null ? "" : " · " + event.ammo_before + " → " + event.ammo_after);
        case "hurt": return t("player_hurt");
        case "end": return t("end") + " · " + t(event.outcome);
        default: return t(event.type);
      }
    }

    function selectEvent(event) {
      selectedEvent = event;
      for (const button of eventList.children) {
        button.setAttribute("aria-current", String(button.event === event));
      }
      if (!event) {
        byId("details").textContent = t("choose");
        return;
      }
      setPlaying(false);
      const index = trial.frames.findIndex(frame => frame.tick >= event.tick);
      showFrame(index < 0 ? trial.frames.length - 1 : index);
      const details = [clock(event.tick) + " · " + eventLabel(event)];
      if (event.type === "command") {
        details.push(event.result?.accepted ? t("accepted") : t("denied"));
        if (event.result?.error) details.push(event.result.error);
        if (event.result?.swing !== undefined) details.push(t(event.result.swing ? "swing" : "no_swing"));
      }
      if (event.waypoint) details.push(t("waypoint") + "  " + pointText(event.waypoint));
      if (event.move) details.push(t("move") + "  " + pointText(event.move));
      if (event.aim) details.push(t("aim") + "  " + pointText(event.aim));
      if (event.target) details.push(t("target") + "  " + event.target);
      if (event.type === "hit") details.push(event.kind === "bullet" ? t("bullet") : itemName(event.kind));
      byId("details").textContent = details.join("\n");
    }

    function renderEvents() {
      const filter = byId("filter").value;
      const relevant = trial.events.filter(event => filter === "all"
        || (filter === "decisions" && event.type === "decision")
        || (filter === "commands" && event.type === "command")
        || (filter === "combat" && !["decision", "command"].includes(event.type)));
      eventList.replaceChildren(...relevant.map(event => {
        const button = document.createElement("button");
        const time = document.createElement("time");
        button.type = "button";
        button.event = event;
        time.textContent = clock(event.tick);
        button.append(time, eventLabel(event));
        button.setAttribute("aria-current", String(event === selectedEvent));
        button.addEventListener("click", () => selectEvent(event));
        return button;
      }));
      if (!relevant.length) eventList.textContent = t("empty");
    }

    function renderTable(id, labels, rows) {
      const header = document.createElement("tr");
      for (const label of labels) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = t(label);
        header.append(cell);
      }
      const body = document.createElement("tbody");
      for (const { values, selected } of rows) {
        const row = document.createElement("tr");
        row.dataset.selected = String(Boolean(selected));
        for (const value of values) {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.append(cell);
        }
        body.append(row);
      }
      const head = document.createElement("thead");
      head.append(header);
      byId(id).replaceChildren(head, body);
    }

    function renderComparison() {
      const labels = trial.density ? ["policy", "outcome", "duration", "kills", "rounds", "uses", "hurt", "ranged_hits", "dodges"]
        : ["policy", "outcome", "duration", "rounds", "swings", "hits", "misses", "hurt"];
      const rows = data.trials.filter(run => run.scenario === trial.scenario && run.seed === trial.seed
        && run.density === trial.density && String(run.loadout) === String(trial.loadout)).map(run => {
        const summary = run.summary;
        return { selected: run === trial, values: [t(run.policy), t(summary.outcome), summary.seconds.toFixed(2) + " s",
          ...(trial.density ? [summary.kills, summary.ammo_used, summary.uses_spent, summary.hurt, summary.ranged_hits ?? "—", summary.dodges ?? "—"]
            : [summary.ammo_used, summary.swings, summary.bullet_hits + " / " + summary.axe_hits, summary.misses, summary.hurt])] };
      });
      renderTable("comparison", labels, rows);
      if (data.rates) {
        byId("batch").hidden = false;
        renderTable("rates", ["density", "passed", "pass_rate"], Object.entries(data.rates).map(([density, row]) => ({
          selected: Number(density) === trial.density,
          values: [density, row.survived + " / " + row.trials, (100 * row.survived / row.trials).toFixed(1) + "%"],
        })));
      }
    }

    function loadTrial() {
      setPlaying(false);
      trial = data.trials[Number(recordingSelect.value)];
      byId("difference").hidden = !data.trials.some(run => run.scenario === trial.scenario && run.policy !== trial.policy
        && run.seed === trial.seed && run.density === trial.density && String(run.loadout) === String(trial.loadout));
      trial.gameEvents ??= trial.events.filter(event => event.id != null);
      timeline.max = trial.frames.length - 1;
      eventList.scrollTop = 0;
      selectEvent(null);
      renderEvents();
      renderComparison();
      showFrame(0);
      updateContext();
    }

    function updateContext() {
      byId("context").textContent = t("info").replace("{seed}", trial.seed ?? data.seed).replace("{rate}", data.tick_rate)
        + (data.sweep && trial.dodge ? " · " + t(trial.policy + "_note") : "");
    }

    function localize() {
      setLanguage(language);
      document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      document.title = t("title");
      for (const element of document.querySelectorAll("[data-t]")) element.textContent = t(element.dataset.t);
      for (const element of document.querySelectorAll("[data-aria]")) element.setAttribute("aria-label", t(element.dataset.aria));
      byId("language").textContent = language === "zh" ? "English" : "中文";
      byId("language").lang = language === "zh" ? "en" : "zh-CN";
      const status = data.trials.length ? t("loaded").replace("{count}", data.trials.length) : t("select_files");
      byId("file-status").textContent = fileErrors.length ? status + " · " + t("invalid_files") + " " + fileErrors.join(", ") : status;
      for (const selector of [".toolbar", ".layout", "#comparison"]) document.querySelector(selector).hidden = !data.trials.length;
      options(scenarioSelect, [...new Set(data.trials.map(run => run.scenario))]);
      updatePolicies();
      options(byId("filter"), ["all", "decisions", "combat", "commands"]);
      options(byId("camera"), ["follow", "overview"]);
      updateRecordings();
    }

    function updatePolicies() {
      options(policySelect, [...new Set(data.trials.filter(run => run.scenario === scenarioSelect.value).map(run => run.policy))]);
    }

    function updateRecordings() {
      const previous = recordingSelect.value;
      const matches = data.trials.flatMap((run, index) =>
        run.scenario === scenarioSelect.value && run.policy === policySelect.value ? [[index, run]] : []);
      recordingSelect.replaceChildren(...matches.map(([index, run]) => new Option(
        (run.category ? t(run.category) + " · " : "") + run.loadout.map(itemName).join(" + ") + (run.density ? " · " + t("pressure") + " " + run.density
          + " · " + t("seed") + " " + run.seed : ""), index,
      )));
      if (matches.some(([index]) => String(index) === previous)) recordingSelect.value = previous;
    }

    function changeSelection() {
      const previous = trial;
      updateRecordings();
      if (previous?.density) {
        const matching = [...recordingSelect.options].find(option => {
          const run = data.trials[Number(option.value)];
          return run.density === previous.density && run.seed === previous.seed && String(run.loadout) === String(previous.loadout);
        });
        if (matching) recordingSelect.value = matching.value;
      }
      loadTrial();
    }
    scenarioSelect.addEventListener("change", () => { updatePolicies(); changeSelection(); });
    policySelect.addEventListener("change", changeSelection);
    recordingSelect.addEventListener("change", loadTrial);
    byId("camera").addEventListener("change", draw);
    byId("overlays").addEventListener("change", draw);
    byId("filter").addEventListener("change", renderEvents);
    byId("language").addEventListener("click", () => {
      language = language === "zh" ? "en" : "zh";
      localize();
      if (!trial) return;
      renderEvents();
      renderComparison();
      selectEvent(selectedEvent);
      byId("play").textContent = t(playing ? "pause" : "play");
      updateContext();
      showFrame(frameIndex);
    });
    byId("files").addEventListener("change", async event => {
      const files = [...event.target.files];
      if (!files.length) return;
      event.target.disabled = true;
      setPlaying(false);
      const reports = [];
      fileErrors = [];
      try {
        for (const file of files) {
          try {
            const report = file.name.toLowerCase().endsWith(".gz") ? await decodeRecording(file) : JSON.parse(await file.text());
            if (!Number.isFinite(report.tick_rate) || report.tick_rate <= 0 || !report.trials?.length ||
                !report.trials.every(run => run.frames?.length && run.frames[0].view?.you &&
                  Array.isArray(run.events) && Array.isArray(run.structures) && Array.isArray(run.chunks) && Array.isArray(run.loadout))) {
              throw new Error("Invalid recording");
            }
            if (reports.length && report.tick_rate !== reports[0].tick_rate) throw new Error("Different replay tick rate");
            reports.push(report);
          } catch {
            fileErrors.push(file.name);
          }
        }
        if (reports.length) {
          const first = reports[0];
          const trials = reports.flatMap(report => report.trials);
          const sharedRates = reports.every(report => JSON.stringify(report.rates) === JSON.stringify(first.rates));
          const sharedWaves = reports.every(report => JSON.stringify(report.wave_seconds) === JSON.stringify(first.wave_seconds));
          data = { ...first, trials, rates: sharedRates ? first.rates : null, wave_seconds: sharedWaves ? first.wave_seconds : null };
          byId("batch").hidden = !data.rates;
          localize();
          loadTrial();
        } else {
          localize();
        }
      } finally {
        event.target.value = "";
        event.target.disabled = false;
      }
    });
    byId("play").addEventListener("click", () => {
      if (!playing && frameIndex === trial.frames.length - 1) showFrame(0);
      setPlaying(!playing);
    });
    function seek(index) {
      setPlaying(false);
      selectEvent(null);
      showFrame(index);
    }
    byId("previous").addEventListener("click", () => seek(frameIndex - 1));
    byId("next").addEventListener("click", () => seek(frameIndex + 1));
    timeline.addEventListener("input", () => seek(Number(timeline.value)));
    byId("speed").addEventListener("change", () => { if (playing) setPlaying(true); });
    byId("difference").addEventListener("click", () => {
      const other = data.trials.find(run => run.scenario === trial.scenario && run.policy !== trial.policy
        && run.seed === trial.seed && run.density === trial.density && String(run.loadout) === String(trial.loadout));
      if (!other) return;
      const index = trial.frames.slice(0, other.frames.length).findIndex((frame, i) =>
        frame.decision?.reason !== other.frames[i].decision?.reason ||
        frame.decision?.weapon !== other.frames[i].decision?.weapon);
      if (index >= 0) {
        seek(index);
        const first = trial.frames[index].decision;
        const second = other.frames[index].decision;
        byId("details").textContent = clock(trial.frames[index].tick) + "\n"
          + t(trial.policy) + " · " + (first ? reason(first.reason) : "—") + "\n"
          + t(other.policy) + " · " + (second ? reason(second.reason) : "—");
      } else {
        byId("details").textContent = t("no_difference");
      }
    });
    localize();
    if (data.trials.length) loadTrial();
    new ResizeObserver(draw).observe(canvas);
  </script>
</body>
</html>
